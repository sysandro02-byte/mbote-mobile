name: Quality checks

on:
  push:
    branches:
      - main
      - dev
      - codex/**
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test

  android:
    name: Android lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Run lint, unit tests, and build debug APK
        env:
          MBOTE_API_BASE_URL: https://example.invalid/api
          VITE_SOCKET_URL: https://example.invalid
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: test-anon-key
          GOOGLE_CLIENT_ID: test-google-client-id
          GITHUB_CLIENT_ID: test-github-client-id
          BREVO_API_KEY: test-brevo-key
          GEMINI_API_KEY: test-gemini-key
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mbote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Quality checks

on:
  push:
    branches:
      - main
      - dev
      - codex/**
      - fix/**
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    name: Production source audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject simulations and embedded secrets
        run: bash ci/production-audit.sh

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test

  production-api-contract:
    name: Production API auth contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Production smoke contract
        env:
          API_ORIGIN: https://mbote-backend.onrender.com
        run: bash ci/smoke-production.sh
      - name: Verify /v1 health and login routes
        shell: bash
        env:
          API_ORIGIN: https://mbote-backend.onrender.com
        run: |
          set -euo pipefail
          health_file="$(mktemp)"
          login_file="$(mktemp)"
          trap 'rm -f "$health_file" "$login_file"' EXIT

          curl_probe() {
            local method="$1" url="$2" output="$3" data="${4:-}"
            local code
            for attempt in 1 2 3 4; do
              if [ "$method" = POST ]; then
                code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 \
                  --retry 2 --retry-delay 3 --retry-all-errors \
                  --header 'Content-Type: application/json' --data "$data" \
                  --output "$output" --write-out '%{http_code}' "$url")" || code="000"
              else
                code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 \
                  --retry 2 --retry-delay 3 --retry-all-errors \
                  --output "$output" --write-out '%{http_code}' "$url")" || code="000"
              fi
              case "$code" in
                000|429|500|502|503|504) sleep $((attempt * 5)) ;;
                *) printf '%s' "$code"; return 0 ;;
              esac
            done
            printf '%s' "$code"
          }

          health_code="$(curl_probe GET "$API_ORIGIN/v1/health" "$health_file")"
          cat "$health_file"
          test "$health_code" = "200"
          grep -q '"success"[[:space:]]*:[[:space:]]*true' "$health_file"

          login_code="$(curl_probe POST "$API_ORIGIN/v1/auth/login" "$login_file" '{"email":"ci-route-probe@invalid.example","password":"not-a-real-password"}')"
          cat "$login_file"
          case "$login_code" in
            400|401) ;;
            404)
              echo 'ERROR: production /v1/auth/login route is missing (404).' >&2
              exit 1
              ;;
            *)
              echo "ERROR: unexpected production login status: $login_code" >&2
              exit 1
              ;;
          esac

  android:
    name: Android lint, tests and stable signed QA APK
    runs-on: ubuntu-latest
    needs:
      - production-audit
      - backend
      - production-api-contract
    timeout-minutes: 35
    env: &android-test-env
      MBOTE_API_BASE_URL: https://mbote-backend.onrender.com/v1
      VITE_SOCKET_URL: https://mbote-backend.onrender.com
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
      FIREBASE_ANDROID_APPLICATION_ID: ${{ secrets.FIREBASE_ANDROID_APPLICATION_ID }}
      FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_PROJECT_ID: ${{ secrets.FIREBASE_ANDROID_PROJECT_ID }}
      FIREBASE_ANDROID_SENDER_ID: ${{ secrets.FIREBASE_ANDROID_SENDER_ID }}
      MBOTE_QA_KEYSTORE_PASSWORD: mbote-qa-test-only
      MBOTE_QA_KEY_ALIAS: mboteqa
      MBOTE_QA_KEY_PASSWORD: mbote-qa-test-only
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Prepare stable QA signing keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mbote-qa-signing"
          base64 --decode ci/mbote-qa-keystore.b64 > "$RUNNER_TEMP/mbote-qa-signing/mbote-qa.keystore"
          test -s "$RUNNER_TEMP/mbote-qa-signing/mbote-qa.keystore"
          echo "MBOTE_QA_KEYSTORE_PATH=$RUNNER_TEMP/mbote-qa-signing/mbote-qa.keystore" >> "$GITHUB_ENV"
      - name: Reject invalid production endpoints
        shell: bash
        run: |
          set -euo pipefail
          test "$MBOTE_API_BASE_URL" = "https://mbote-backend.onrender.com/v1"
          test "$VITE_SOCKET_URL" = "https://mbote-backend.onrender.com"
          ! printf '%s\n%s\n' "$MBOTE_API_BASE_URL" "$VITE_SOCKET_URL" | grep -q 'example.invalid'
      - name: Verify production TURN readiness
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' --connect-timeout 15 --max-time 45 https://mbote-backend.onrender.com/v1/readiness)"
          cat "$body"
          test "$code" = "200"
          grep -q '"liveTurn":true' "$body"
      - name: Build installable QA APK
        run: gradle --no-daemon --max-workers=2 --stacktrace clean assembleQa
      - name: Run Android unit tests
        run: gradle --no-daemon --max-workers=2 --stacktrace testQaUnitTest
      - name: Run Android lint
        run: gradle --no-daemon --max-workers=2 --stacktrace lintQa
      - name: Locate Android SDK build tools
        id: android-tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
      - name: Verify stable APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/qa/app-qa.apk"
          TOOLS="${{ steps.android-tools.outputs.build_tools }}"
          test -s "$APK"
          SIGNATURE_INFO="$($TOOLS/apksigner verify --verbose --print-certs "$APK")"
          echo "$SIGNATURE_INFO"
          echo "$SIGNATURE_INFO" | tr '[:upper:]' '[:lower:]' | grep -q 'a1ec5aac2b61ef68640eea7095997a0c6cafbb75366f85e15ec05d9f6158cb69'
          BADGING="$($TOOLS/aapt dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.aistudio.mbote.krtwvx.qa'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" > app/build/outputs/apk/qa/mbote-apk-info.txt
          printf '%s\n' "$SIGNATURE_INFO" > app/build/outputs/apk/qa/mbote-apk-signature.txt
          sha256sum "$APK" > app/build/outputs/apk/qa/mbote-apk-sha256.txt
      - name: Prepare QA APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/test-apk
          cp app/build/outputs/apk/qa/app-qa.apk app/build/test-apk/MBote-QA.apk
          cp app/build/outputs/apk/qa/mbote-apk-info.txt app/build/test-apk/
          cp app/build/outputs/apk/qa/mbote-apk-signature.txt app/build/test-apk/
          cp app/build/outputs/apk/qa/mbote-apk-sha256.txt app/build/test-apk/
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload branch QA APK
        if: github.ref != 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: mbote-stable-qa-apk
          path: |
            app/build/outputs/apk/qa/app-qa.apk
            app/build/outputs/apk/qa/mbote-apk-info.txt
            app/build/outputs/apk/qa/mbote-apk-signature.txt
            app/build/outputs/apk/qa/mbote-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable installable QA APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: mbote-installable-qa-apk
          path: app/build/test-apk/
          if-no-files-found: error
          retention-days: 30

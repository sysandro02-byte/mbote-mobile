name: Quality checks

on:
  push:
    branches:
      - main
      - dev
      - codex/**
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test

  android:
    name: Android lint, tests and production-connected APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: &android-test-env
      MBOTE_API_BASE_URL: https://mbote-backend.onrender.com/v1
      VITE_SOCKET_URL: https://mbote-backend.onrender.com
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Reject invalid production endpoints
        shell: bash
        run: |
          set -euo pipefail
          test "$MBOTE_API_BASE_URL" = "https://mbote-backend.onrender.com/v1"
          test "$VITE_SOCKET_URL" = "https://mbote-backend.onrender.com"
          ! printf '%s\n%s\n' "$MBOTE_API_BASE_URL" "$VITE_SOCKET_URL" | grep -q 'example.invalid'
      - name: Compile and build debug APK
        run: gradle --no-daemon --max-workers=2 --stacktrace clean assembleDebug
      - name: Run Android unit tests
        run: gradle --no-daemon --max-workers=2 --stacktrace testDebugUnitTest
      - name: Run Android lint
        run: gradle --no-daemon --max-workers=2 --stacktrace lintDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload production-connected debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mbote-production-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

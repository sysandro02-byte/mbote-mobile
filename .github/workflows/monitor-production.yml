name: MBote production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 30 https://mbote-backend.onrender.com/v1/health)"
          cat "$body"
          test "$code" = "200"
          grep -q '"status":"online"' "$body"
          node - "$body" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const data = payload.data || payload;
          if (!Number.isFinite(data.databaseLatencyMs) || data.databaseLatencyMs > 5000) {
            console.error('PostgreSQL health latency is too high', data.databaseLatencyMs);
            process.exit(1);
          }
          if (!Number.isFinite(data.uptimeSec)) {
            console.error('Backend health payload is incomplete');
            process.exit(1);
          }
          NODE
          rm -f "$body"

      - name: Check public legal pages and RTC protection
        shell: bash
        run: |
          set -euo pipefail
          origin="https://mbote-backend.onrender.com"
          for path in /privacy /terms /account-deletion; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$origin$path")"
            test "$code" = "200"
          done
          rtc_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$origin/v1/rtc/ice-servers")"
          test "$rtc_code" = "401"

      - name: Check authenticated WebSocket gateway
        shell: bash
        run: |
          node <<'NODE'
          const timer = setTimeout(() => {
            console.error('WebSocket timeout');
            process.exit(1);
          }, 15000);
          const ws = new WebSocket('wss://mbote-backend.onrender.com/ws');
          ws.onopen = () => ws.send(JSON.stringify({type:'AUTH', token:'monitor-invalid-token'}));
          ws.onerror = (error) => {
            clearTimeout(timer);
            console.error('WebSocket unavailable', error);
            process.exit(1);
          };
          ws.onclose = (event) => {
            clearTimeout(timer);
            if (event.code !== 1008) {
              console.error('Unexpected WebSocket close code', event.code);
              process.exit(1);
            }
            console.log('WebSocket gateway online and enforcing authentication');
          };
          NODE
